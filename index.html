<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vibhakar Kumar | DevOps Engineer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevOps Engineer specializing in cloud automation, CI/CD pipelines, and infrastructure management">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- ================== FULL ORIGINAL CSS ================== -->
  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #60a5fa;
      --primary-dark: #1d4ed8;
      --secondary: #10b981;
      --accent: #8b5cf6;
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: rgba(30, 41, 59, 0.7);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --border: #334155;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --gradient-primary: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      --gradient-secondary: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 80px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-secondary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* HEADER */
    header {
      position: fixed;
      width: 100%;
      top: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-highlight {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      position: relative;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* HERO */
    .hero {
      padding: 12rem 0 6rem;
      background: linear-gradient(135deg, var(--bg-primary), #1a1f35);
    }

    .hero-content {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 5rem;
      align-items: center;
    }

    .hero-text h1 {
      font-size: 3.5rem;
      color: var(--text-primary);
    }

    .hero-text h1 span {
      display: inline-block;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: floatingName 3s ease-in-out infinite;
    }

    @keyframes floatingName {
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
    }

    .profile-image {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      overflow: hidden;
      padding: 4px;
      background: var(--gradient-primary);
    }

    .profile-image img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* FOOTER */
    .footer {
      background: #0a0f1d;
      padding: 3rem 0;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      .hero-content { grid-template-columns: 1fr; text-align: center; }
      .nav-links { display: none; }
      .mobile-menu-btn { display: block; }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <nav>
      <div class="logo">
        <i class="fas fa-code"></i>
        <span>Vibhakar<span class="logo-highlight">DevOps</span></span>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <i class="fas fa-bars"></i>
      </button>
      <div class="nav-links" id="navLinks">
        <a href="#home">Home</a>
      </div>
    </nav>
  </div>
</header>

<section id="home" class="hero">
  <div class="container hero-content">
    <div class="hero-text">
      <h1>DevOps Engineer <span>Vibhakar Kumar</span></h1>
      <p>Cloud • CI/CD • Automation</p>
    </div>

    <div class="profile-image">
      <!-- ✅ ONLY CHANGE: id added -->
      <img src="assets/pic.jpg" alt="Vibhakar Kumar" id="profileImg">
    </div>
  </div>
</section>

<footer class="footer">
  <p>&copy; 2024 Vibhakar Kumar</p>
</footer>

<!-- ================== FULL JS (MERGED) ================== -->
<script>
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const navLinks = document.getElementById('navLinks');

  mobileMenuBtn.addEventListener('click', () => {
    navLinks.classList.toggle('active');
  });

  // ✅ IMAGE FALLBACK CHECK (ONLY NEW LOGIC)
  const profileImg = document.getElementById('profileImg');
  profileImg.onerror = function () {
    this.onerror = null;
    this.src = "https://avatars.githubusercontent.com/u/9919?v=4";
  };
</script>

</body>
</html>
