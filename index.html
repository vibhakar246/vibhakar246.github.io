<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vibhakar Kumar | DevOps & AIOps Engineer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevOps & AIOps Engineer specializing in cloud automation, infrastructure, and AI-driven operations">
  <meta name="keywords" content="DevOps, AIOps, Cloud Engineer, AWS, Kubernetes, Terraform, CI/CD, Automation, Infrastructure">
  <meta name="author" content="Vibhakar Kumar">
  
  <!-- Open Graph for LinkedIn/Social Sharing -->
  <meta property="og:title" content="Vibhakar Kumar | DevOps & AIOps Engineer">
  <meta property="og:description" content="Bridging development and operations with AI-driven automation for scalable cloud systems.">
  <meta property="og:type" content="website">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a192f;
      --bg-secondary: #112240;
      --bg-tertiary: #0d1b3a;
      --accent-primary: #64ffda;
      --accent-secondary: #ff9900;
      --accent-tertiary: #f46800;
      --text-primary: #e6f1ff;
      --text-secondary: #a8b2d1;
      --text-muted: #8892b0;
      --card-shadow: rgba(2, 12, 27, 0.7);
      --transition: all 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
      --border-radius: 12px;
      --section-spacing: 100px;
    }

    * { 
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-tertiary) 100%);
      color: var(--text-secondary);
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Typography */
    h1, h2, h3, h4, h5, h6 {
      font-weight: 600;
      line-height: 1.2;
      color: var(--text-primary);
    }

    .code-font {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Animated background elements */
    .bg-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.03;
      animation: float 25s infinite linear;
      filter: blur(40px);
    }

    .shape:nth-child(1) {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, var(--accent-primary), #1de9b6);
      top: 10%;
      left: 5%;
      animation-delay: 0s;
      animation-duration: 30s;
    }

    .shape:nth-child(2) {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, var(--accent-secondary), #ff6600);
      top: 60%;
      right: 10%;
      animation-delay: -8s;
      animation-duration: 35s;
    }

    .shape:nth-child(3) {
      width: 250px;
      height: 250px;
      background: linear-gradient(135deg, var(--accent-tertiary), #ff4500);
      bottom: 10%;
      left: 20%;
      animation-delay: -15s;
      animation-duration: 40s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
      25% {
        transform: translate(30px, -40px) rotate(90deg) scale(1.05);
      }
      50% {
        transform: translate(-20px, 30px) rotate(180deg) scale(1.1);
      }
      75% {
        transform: translate(-30px, -20px) rotate(270deg) scale(1.05);
      }
    }

    /* Navigation */
    .main-nav {
      position: fixed;
      top: 30px;
      right: 50px;
      z-index: 1000;
      background: rgba(17, 34, 64, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 50px;
      padding: 12px 24px;
      border: 1px solid rgba(100, 255, 218, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .nav-list {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 20px;
      transition: var(--transition);
      position: relative;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--accent-primary);
      background: rgba(100, 255, 218, 0.1);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 2px;
      background: var(--accent-primary);
      transition: width 0.3s ease;
    }

    .nav-link:hover::after, .nav-link.active::after {
      width: 70%;
    }

    /* Container and Layout */
    .container { 
      max-width: 1400px; 
      margin: 0 auto;
      display: flex;
      padding: 0 40px;
      position: relative;
      z-index: 1;
    }

    /* SIDEBAR - Enhanced */
    .sidebar {
      width: 40%;
      padding: 120px 60px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(135deg, rgba(17, 34, 64, 0.85), rgba(13, 27, 58, 0.9));
      backdrop-filter: blur(15px);
      border-right: 1px solid rgba(100, 255, 218, 0.15);
      box-shadow: 10px 0 40px rgba(0, 0, 0, 0.2);
    }

    .avatar-container {
      width: 240px;
      height: 240px;
      margin-bottom: 40px;
      position: relative;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--accent-primary), #1de9b6);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid rgba(100, 255, 218, 0.3);
      box-shadow: 
        0 20px 60px rgba(100, 255, 218, 0.2),
        0 0 0 1px rgba(100, 255, 218, 0.1) inset;
      transition: var(--transition);
      overflow: hidden;
    }

    .avatar::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, var(--accent-primary), transparent, var(--accent-primary));
      border-radius: 26px;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .avatar:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(100, 255, 218, 0.5);
      box-shadow: 
        0 30px 80px rgba(100, 255, 218, 0.3),
        0 0 0 1px rgba(100, 255, 218, 0.2) inset;
    }

    .avatar:hover::before {
      opacity: 1;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .avatar:hover img {
      transform: scale(1.05);
    }

    .avatar-container::after {
      content: '';
      position: absolute;
      width: 260px;
      height: 260px;
      border: 2px solid var(--accent-primary);
      border-radius: 28px;
      top: -12px;
      left: -12px;
      z-index: -1;
      opacity: 0.3;
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { 
        opacity: 0.3;
        transform: scale(1);
      }
      50% { 
        opacity: 0.6;
        transform: scale(1.02);
      }
    }

    .sidebar h1 { 
      font-size: 3.5rem; 
      margin: 0 0 10px 0; 
      background: linear-gradient(135deg, var(--accent-primary), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }

    .sidebar h2 { 
      font-size: 1.5rem; 
      color: var(--text-secondary); 
      margin: 0 0 30px 0; 
      font-weight: 500;
      letter-spacing: 1px;
      position: relative;
      display: inline-block;
    }

    .sidebar h2::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 60px;
      height: 3px;
      background: var(--accent-primary);
      border-radius: 2px;
    }

    .sidebar p { 
      font-size: 1.1rem; 
      margin-bottom: 50px;
      line-height: 1.8;
      color: var(--text-muted);
    }

    .highlight {
      color: var(--accent-primary);
      font-weight: 500;
    }

    .contact-info {
      margin-bottom: 40px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
      color: var(--text-secondary);
      transition: var(--transition);
      padding: 10px 15px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
    }

    .contact-item:hover {
      color: var(--accent-primary);
      transform: translateX(8px);
      background: rgba(100, 255, 218, 0.05);
    }

    .contact-item i {
      width: 20px;
      color: var(--accent-primary);
      font-size: 18px;
    }

    .availability {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(100, 255, 218, 0.1);
      color: var(--accent-primary);
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 30px;
      border: 1px solid rgba(100, 255, 218, 0.2);
    }

    .availability::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--accent-primary);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .socials { 
      display: flex; 
      gap: 25px; 
      font-size: 26px; 
      margin-top: 20px;
    }

    .socials a { 
      color: var(--text-secondary); 
      transition: var(--transition);
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .socials a:hover { 
      color: var(--accent-primary); 
      transform: translateY(-5px);
      background: rgba(100, 255, 218, 0.1);
      border-color: rgba(100, 255, 218, 0.3);
      box-shadow: 0 10px 20px rgba(100, 255, 218, 0.1);
    }

    /* MAIN CONTENT */
    .content { 
      width: 60%; 
      padding: 120px 60px; 
    }

    section { 
      margin-bottom: var(--section-spacing); 
      opacity: 0;
      transform: translateY(40px);
      animation: fadeInUp 0.8s forwards;
      scroll-margin-top: 50px;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    section:nth-child(1) { animation-delay: 0.1s; }
    section:nth-child(2) { animation-delay: 0.3s; }
    section:nth-child(3) { animation-delay: 0.5s; }
    section:nth-child(4) { animation-delay: 0.7s; }
    section:nth-child(5) { animation-delay: 0.9s; }

    .section-head {
      display: flex;
      align-items: center;
      margin-bottom: 50px;
      position: relative;
    }

    .section-head h3 {
      color: var(--accent-primary);
      font-size: 2rem;
      font-weight: 600;
      margin-right: 20px;
      white-space: nowrap;
      position: relative;
    }

    .section-head h3::before {
      content: '01.';
      position: absolute;
      left: -50px;
      color: var(--accent-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      opacity: 0.5;
    }

    #skills .section-head h3::before { content: '02.'; }
    #projects .section-head h3::before { content: '03.'; }
    #certifications .section-head h3::before { content: '04.'; }
    #education .section-head h3::before { content: '05.'; }

    .section-head-line {
      height: 1px;
      flex-grow: 1;
      background: linear-gradient(90deg, var(--accent-primary) 0%, rgba(100, 255, 218, 0.2) 100%);
      position: relative;
    }

    .section-head-line::after {
      content: '';
      position: absolute;
      right: 0;
      top: -3px;
      width: 8px;
      height: 8px;
      background: var(--accent-primary);
      border-radius: 50%;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Experience Summary */
    .experience-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      margin-top: 40px;
    }

    .exp-item {
      background: rgba(17, 34, 64, 0.5);
      border-radius: var(--border-radius);
      padding: 25px;
      text-align: center;
      border: 1px solid rgba(100, 255, 218, 0.1);
      transition: var(--transition);
    }

    .exp-item:hover {
      transform: translateY(-5px);
      border-color: rgba(100, 255, 218, 0.3);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    }

    .exp-number {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent-primary);
      margin-bottom: 10px;
      font-family: 'JetBrains Mono', monospace;
    }

    .exp-label {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* SKILLS GRID - Enhanced */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
    }

    .skill-cat {
      background: linear-gradient(145deg, rgba(17, 34, 64, 0.7), rgba(13, 27, 58, 0.5));
      border-radius: var(--border-radius);
      padding: 30px;
      transition: var(--transition);
      border: 1px solid rgba(100, 255, 218, 0.1);
      position: relative;
      overflow: hidden;
    }

    .skill-cat::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--accent-primary), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .skill-cat:hover {
      transform: translateY(-10px);
      border-color: rgba(100, 255, 218, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .skill-cat:hover::before {
      opacity: 1;
    }

    .skill-cat h4 {
      color: var(--text-primary);
      margin-bottom: 25px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .skill-cat h4 i {
      color: var(--accent-primary);
      font-size: 1.5rem;
    }

    .skill-items {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .skill-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px;
      border-radius: 8px;
      transition: var(--transition);
      position: relative;
    }

    .skill-item:hover {
      background: rgba(100, 255, 218, 0.05);
      transform: translateX(5px);
    }

    .skill-item::before {
      content: '▸';
      color: var(--accent-primary);
      font-size: 14px;
      position: absolute;
      left: -20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .skill-item:hover::before {
      opacity: 1;
    }

    .skill-item i {
      font-size: 32px;
      width: 36px;
      text-align: center;
      transition: var(--transition);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    /* Icon colors remain the same */
    .skill-item i.devicon-amazonwebservices-plain { color: var(--accent-secondary) !important; }
    .fa-grafana { color: var(--accent-tertiary) !important; }
    .skill-item i.devicon-googlecloud-plain { color: #4285F4 !important; }
    .skill-item i.devicon-terraform-plain { color: #7B42BC !important; }
    .skill-item i.devicon-ansible-plain { color: #EE0000 !important; }
    .skill-item i.devicon-jenkins-line { color: #D24939 !important; }
    .skill-item i.devicon-docker-plain { color: #2496ED !important; }
    .skill-item i.devicon-kubernetes-plain { color: #326CE5 !important; }
    .skill-item i.devicon-prometheus-original { color: #E6522C !important; }
    .skill-item i.devicon-python-plain { color: #3776AB !important; }
    .skill-item i.fa-brain { color: var(--accent-primary) !important; }

    .skill-name {
      font-size: 1rem;
      flex-grow: 1;
      font-weight: 500;
    }

    .skill-level {
      width: 60px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .skill-level::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: var(--accent-primary);
      width: 90%;
      border-radius: 2px;
    }

    .skill-item:nth-child(2) .skill-level::after { width: 85%; }
    .skill-item:nth-child(3) .skill-level::after { width: 80%; }
    .skill-item:nth-child(4) .skill-level::after { width: 75%; }

    /* PROJECTS - Enhanced */
    .projects-grid {
      display: grid;
      gap: 40px;
    }

    .card {
      background: linear-gradient(145deg, rgba(17, 34, 64, 0.7), rgba(13, 27, 58, 0.5));
      padding: 40px;
      border-radius: var(--border-radius);
      transition: var(--transition);
      border: 1px solid rgba(100, 255, 218, 0.1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .card:hover::before {
      transform: translateX(100%);
    }

    .card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(100, 255, 218, 0.05) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .card:hover::after {
      opacity: 1;
    }

    .card:hover {
      transform: translateY(-15px);
      border-color: rgba(100, 255, 218, 0.3);
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(100, 255, 218, 0.1);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .card h3 {
      color: var(--text-primary);
      font-size: 1.5rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .card h3 i {
      color: var(--accent-primary);
      font-size: 1.8rem;
    }

    .project-links {
      display: flex;
      gap: 15px;
    }

    .project-link, .live-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 1.5rem;
      transition: var(--transition);
    }

    .project-link:hover, .live-link:hover {
      color: var(--accent-primary);
      transform: translateY(-3px);
    }

    .card p {
      color: var(--text-secondary);
      margin-bottom: 25px;
      line-height: 1.8;
      font-size: 1.05rem;
    }

    .features {
      margin-bottom: 25px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .feature i {
      color: var(--accent-primary);
      font-size: 12px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tags span {
      background: rgba(100, 255, 218, 0.1);
      color: var(--accent-primary);
      padding: 6px 15px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: var(--transition);
      border: 1px solid rgba(100, 255, 218, 0.2);
    }

    .card:hover .tags span {
      transform: scale(1.05);
      background: rgba(100, 255, 218, 0.15);
      border-color: rgba(100, 255, 218, 0.3);
    }

    /* CERTIFICATIONS */
    .certifications-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 40px;
    }

    .cert-card {
      background: linear-gradient(145deg, rgba(17, 34, 64, 0.7), rgba(13, 27, 58, 0.5));
      border-radius: var(--border-radius);
      padding: 30px;
      border: 1px solid rgba(100, 255, 218, 0.1);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .cert-card:hover {
      transform: translateY(-10px);
      border-color: rgba(100, 255, 218, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .cert-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, var(--accent-primary), #1de9b6);
      color: var(--bg-primary);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 6px 20px rgba(100, 255, 218, 0.3);
      transition: var(--transition);
    }

    .cert-card:hover .cert-badge {
      transform: scale(1.1) rotate(10deg);
    }

    .cert-card h4 {
      color: var(--text-primary);
      font-size: 1.2rem;

      color: var(--accent-primary);
      text-decoration: none;
      transition: var(--transition);
    }

    .footer a:hover {
      text-decoration: underline;
    }
